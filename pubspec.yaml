name: timetable
description: A local-only college class timetable app (Phase 1).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence — maintained Isar community fork (ships 16 KB-aligned
  # native libs required by Google Play for Android 15+ targets).
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.3

  # IDs
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8
  home_widget: ^0.9.3
  share_plus: ^13.1.0
  app_links: ^7.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2

  # AI timetable import (pick image/PDF + call the Edge Function proxy)
  file_picker: ^8.1.2
  http: ^1.2.2
  image: ^4.2.0 # downscale photos before upload (smaller payload, faster OCR)

# file_picker pulls win32 ^5 while share_plus 13 wants win32 ^6. win32 is a
# Windows-only package and this app targets Android/iOS, so pinning to 5.x is
# safe and resolves the conflict without downgrading share_plus.
dependency_overrides:
  win32: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Isar code generation
  build_runner: ^2.4.11
  isar_community_generator: ^3.3.2

  # App launcher icon generation
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App icon generation (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#565FCB"
  adaptive_icon_background: "#565FCB"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
